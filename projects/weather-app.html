<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmosphere - Weather App</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-card: rgba(255, 255, 255, 0.05);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    /* Weather Type Theme Modifiers */
    body.theme-clear {
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
    }
    body.theme-clouds {
      --bg-gradient: linear-gradient(135deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      --accent: #cbd5e1;
      --accent-glow: rgba(203, 213, 225, 0.3);
    }
    body.theme-rain {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 60%, #172554 100%);
      --accent: #60a5fa;
      --accent-glow: rgba(96, 165, 250, 0.4);
    }
    body.theme-snow {
      --bg-gradient: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      --accent: #e2e8f0;
      --accent-glow: rgba(226, 232, 240, 0.5);
    }
    body.theme-thunder {
      --bg-gradient: linear-gradient(135deg, #171717 0%, #2e1065 50%, #0f172a 100%);
      --accent: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 1.2s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Canvas FX */
    #weatherCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .app-card {
      width: 100%;
      max-width: 900px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      z-index: 2;
      position: relative;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Search Bar & Autocomplete */
    .search-wrapper {
      position: relative;
      margin-bottom: 32px;
      z-index: 10;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 6px 16px;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      background: rgba(0, 0, 0, 0.35);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      padding: 12px 10px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn, .geo-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn:hover, .geo-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Suggestions Dropdown */
    .suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      max-height: 250px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      list-style: none;
    }

    .suggestions.active {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .suggestions li {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s ease;
    }

    .suggestions li:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Layout Grid */
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 768px) {
      .weather-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    /* Main Card Info */
    .main-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .location-header {
      margin-bottom: 24px;
    }

    .location-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .country-badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      font-weight: 500;
    }

    /* Clock Styling */
    .time-container {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .date-str {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* Temperature Display */
    .temp-display {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }

    .temp-value {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-icon-lg {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 10px 15px var(--accent-glow));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .condition-text {
      font-size: 1.3rem;
      font-weight: 500;
      text-transform: capitalize;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .feels-like {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Metrics Grid Side */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .metric-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .metric-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .metric-icon {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent);
    }

    .metric-info h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-info p {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Forecast Section */
    .forecast-section {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--glass-border);
    }

    .forecast-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
    }

    .forecast-item {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .forecast-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-3px);
    }

    .forecast-day {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .forecast-icon {
      width: 32px;
      height: 32px;
      margin: 6px auto;
    }

    .forecast-temp {
      font-size: 1rem;
      font-weight: 600;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="theme-clear">

  <canvas id="weatherCanvas"></canvas>

  <main class="app-card">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 14px; font-weight: 500;">Fetching Atmosphere...</p>
    </div>

    <!-- Search Section -->
    <div class="search-wrapper">
      <div class="search-box">
        <i data-lucide="search" style="color: var(--text-muted); min-width: 20px;"></i>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Type city or country (e.g. Tokyo, Paris, Lebanon)..."
          autocomplete="off"
        />
        <button class="geo-btn" id="geoBtn" title="Use current location">
          <i data-lucide="locate-fixed"></i>
        </button>
      </div>
      <ul class="suggestions" id="suggestions"></ul>
    </div>

    <!-- Weather Content Grid -->
    <div class="weather-grid">
      <!-- Main Temperature & Time -->
      <div class="main-info">
        <div class="location-header">
          <div class="location-name">
            <span id="cityName">--</span>
            <span class="country-badge" id="countryCode">--</span>
          </div>
          <div class="time-container">
            <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
            <span id="exactTime">00:00:00 AM</span>
          </div>
          <div class="date-str" id="exactDate">Loading date...</div>
        </div>

        <div class="temp-display">
          <div id="weatherIconContainer">
            <i data-lucide="sun" class="weather-icon-lg" style="color: #fde047;"></i>
          </div>
          <div>
            <div class="temp-value"><span id="temperature">--</span>°C</div>
            <div class="condition-text" id="condition">--</div>
            <div class="feels-like">Feels like <span id="feelsLike">--</span>°C</div>
          </div>
        </div>
      </div>

      <!-- Detailed Metrics Grid -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-icon"><i data-lucide="wind"></i></div>
          <div class="metric-info">
            <h4>Wind Speed</h4>
            <p><span id="windSpeed">--</span> km/h</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon"><i data-lucide="droplets"></i></div>
          <div class="metric-info">
            <h4>Humidity</h4>
            <p><span id="humidity">--</span>%</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon"><i data-lucide="gauge"></i></div>
          <div class="metric-info">
            <h4>Pressure</h4>
            <p><span id="pressure">--</span> hPa</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon"><i data-lucide="eye"></i></div>
          <div class="metric-info">
            <h4>UV Index</h4>
            <p><span id="uvIndex">--</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 5-Day Forecast -->
    <div class="forecast-section">
      <div class="forecast-title">
        <i data-lucide="calendar" style="color: var(--accent); width: 20px;"></i>
        <span>5-Day Forecast</span>
      </div>
      <div class="forecast-list" id="forecastList">
        <!-- Dynamically Populated -->
      </div>
    </div>
  </main>

  <script>
    // State & Variables
    let clockInterval = null;
    let timeZone = 'UTC';
    let animationFrameId = null;

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const suggestions = document.getElementById('suggestions');
    const loading = document.getElementById('loading');
    const geoBtn = document.getElementById('geoBtn');

    // Weather Canvas Setup
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Weather Codes mapping to visual styles and icons
    const weatherCodes = {
      0: { name: 'Clear Sky', icon: 'sun', color: '#fde047', theme: 'theme-clear', type: 'clear' },
      1: { name: 'Mainly Clear', icon: 'sun-medium', color: '#fde047', theme: 'theme-clear', type: 'clear' },
      2: { name: 'Partly Cloudy', icon: 'cloud-sun', color: '#cbd5e1', theme: 'theme-clouds', type: 'clouds' },
      3: { name: 'Overcast', icon: 'cloud', color: '#94a3b8', theme: 'theme-clouds', type: 'clouds' },
      45: { name: 'Foggy', icon: 'cloud-fog', color: '#cbd5e1', theme: 'theme-clouds', type: 'clouds' },
      48: { name: 'Depositing Rime Fog', icon: 'cloud-fog', color: '#cbd5e1', theme: 'theme-clouds', type: 'clouds' },
      51: { name: 'Light Drizzle', icon: 'cloud-drizzle', color: '#60a5fa', theme: 'theme-rain', type: 'rain' },
      61: { name: 'Slight Rain', icon: 'cloud-rain', color: '#38bdf8', theme: 'theme-rain', type: 'rain' },
      63: { name: 'Moderate Rain', icon: 'cloud-rain', color: '#2563eb', theme: 'theme-rain', type: 'rain' },
      65: { name: 'Heavy Rain', icon: 'cloud-rain-wind', color: '#1d4ed8', theme: 'theme-rain', type: 'rain' },
      71: { name: 'Slight Snow', icon: 'snowflake', color: '#e2e8f0', theme: 'theme-snow', type: 'snow' },
      73: { name: 'Moderate Snow', icon: 'snowflake', color: '#f8fafc', theme: 'theme-snow', type: 'snow' },
      95: { name: 'Thunderstorm', icon: 'cloud-lightning', color: '#c084fc', theme: 'theme-thunder', type: 'thunder' }
    };

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
      window.lucide?.createIcons();
      fetchWeatherByCity('London'); // Default City
    });

    // Auto-complete Search Input Listener
    let debounceTimer;
    let suggestionVersion = 0;
    let weatherVersion = 0;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const version = ++suggestionVersion;
      const query = e.target.value.trim();
      
      if (query.length < 2) {
        suggestions.classList.remove('active');
        return;
      }

      debounceTimer = setTimeout(() => {
        fetchLocationSuggestions(query, version);
      }, 300);
    });

    async function fetchLocationSuggestions(query, version) {
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
        const data = await res.json();
        
        if (version !== suggestionVersion) return;
        if (data.results && data.results.length > 0) {
          renderSuggestions(data.results);
        } else {
          suggestions.classList.remove('active');
        }
      } catch (err) {
        console.error('Error fetching suggestions:', err);
      }
    }

    function renderSuggestions(list) {
      suggestions.innerHTML = '';
      list.forEach(item => {
        const li = document.createElement('li');
        const country = item.country || '';
        const admin = item.admin1 ? `, ${item.admin1}` : '';
        li.innerHTML = `
          <span><strong></strong><span class="suggestion-region"></span></span>
          <span style="font-size: 0.8rem; color: var(--text-muted);" class="suggestion-country"></span>
        `;
        li.querySelector('strong').textContent = item.name;
        li.querySelector('.suggestion-region').textContent = admin;
        li.querySelector('.suggestion-country').textContent = country;
        li.addEventListener('click', () => {
          ++suggestionVersion;
          searchInput.value = `${item.name}${country ? ', ' + country : ''}`;
          suggestions.classList.remove('active');
          getWeatherData(item.latitude, item.longitude, item.name, item.country_code || item.country);
        });
        suggestions.appendChild(li);
      });
      suggestions.classList.add('active');
    }

    // Close suggestions on outside click
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestions.contains(e.target)) {
        suggestions.classList.remove('active');
      }
    });

    // Search on Enter Key
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (query) {
          ++suggestionVersion;
          suggestions.classList.remove('active');
          fetchWeatherByCity(query);
        }
      }
    });

    // Current Geolocation
    geoBtn.addEventListener('click', () => {
      if (navigator.geolocation) {
        const version = ++weatherVersion;
        loading.classList.add('active');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            getWeatherData(latitude, longitude, "Current Location", "", version);
          },
          () => {
            if (version !== weatherVersion) return;
            loading.classList.remove('active');
            alert('Unable to retrieve location. Please check browser permissions.');
          },
          { timeout: 10000 }
        );
      }
    });

    // Fetch Weather by City Search
    async function fetchWeatherByCity(cityName) {
      const version = ++weatherVersion;
      loading.classList.add('active');
      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
        if (!geoRes.ok) throw new Error("City lookup failed");
        const geoData = await geoRes.json();
        if (version !== weatherVersion) return;

        if (!geoData.results || geoData.results.length === 0) {
          alert('City or country not found. Please try again!');
          loading.classList.remove('active');
          return;
        }

        const location = geoData.results[0];
        getWeatherData(location.latitude, location.longitude, location.name, location.country_code || location.country, version);
      } catch (error) {
        if (version !== weatherVersion) return;
        console.error('Error fetching city data:', error);
        alert('Could not search for that city. Please try again.');
        loading.classList.remove('active');
      }
    }

    // Fetch Complete Weather Payload
    async function getWeatherData(lat, lon, name, country, version = ++weatherVersion) {
      if (version !== weatherVersion) return;
      loading.classList.add('active');
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
        
        const res = await fetch(url);
        const data = await res.json();

        if (version !== weatherVersion) return;
        if (!res.ok || !data.current || !data.daily) throw new Error("Forecast unavailable");
        timeZone = data.timezone;
        updateUI(data, name, country);
      } catch (err) {
        if (version !== weatherVersion) return;
        console.error('Error fetching weather:', err);
        alert('Failed to load weather data.');
      } finally {
        if (version === weatherVersion) loading.classList.remove('active');
      }
    }

    // Update UI Components
    function updateUI(data, name, country) {
      const current = data.current;
      const daily = data.daily;
      const codeInfo = weatherCodes[current.weather_code] || { name: 'Clear', icon: 'sun', color: '#fde047', theme: 'theme-clear', type: 'clear' };

      // Apply Theme
      document.body.className = codeInfo.theme;

      // Header Info
      document.getElementById('cityName').textContent = name;
      document.getElementById('countryCode').textContent = country ? country.toUpperCase() : '';

      // Live Timezone Clock Initialization
      startClock(timeZone);

      // Temperatures & Details
      document.getElementById('temperature').textContent = Math.round(current.temperature_2m);
      document.getElementById('feelsLike').textContent = Math.round(current.apparent_temperature);
      document.getElementById('condition').textContent = codeInfo.name;
      document.getElementById('windSpeed').textContent = Math.round(current.wind_speed_10m);
      document.getElementById('humidity').textContent = current.relative_humidity_2m;
      document.getElementById('pressure').textContent = Math.round(current.surface_pressure);
      document.getElementById('uvIndex').textContent = daily.uv_index_max[0] || 'N/A';

      // Icon Update
      const iconContainer = document.getElementById('weatherIconContainer');
      iconContainer.innerHTML = `<i data-lucide="${codeInfo.icon}" class="weather-icon-lg" style="color: ${codeInfo.color};"></i>`;
      window.lucide?.createIcons();

      // Render 5-day Forecast
      renderForecast(daily);

      // Trigger Canvas Particle Animations
      initWeatherParticles(codeInfo.type);
    }

    // Live Clock with Local Timezone
    function startClock(tz) {
      if (clockInterval) clearInterval(clockInterval);

      function updateTime() {
        const now = new Date();
        
        try {
          // Format Time
          const timeOptions = {
            timeZone: tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          };
          document.getElementById('exactTime').textContent = new Intl.DateTimeFormat('en-US', timeOptions).format(now);

          // Format Date
          const dateOptions = {
            timeZone: tz,
            weekday: 'long',
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          };
          document.getElementById('exactDate').textContent = new Intl.DateTimeFormat('en-US', dateOptions).format(now);
        } catch (e) {
          document.getElementById('exactTime').textContent = now.toLocaleTimeString();
        }
      }

      updateTime();
      clockInterval = setInterval(updateTime, 1000);
    }

    // Forecast Renderer
    function renderForecast(daily) {
      const forecastList = document.getElementById('forecastList');
      forecastList.innerHTML = '';

      // Skip today (index 0), get next 5 days
      for (let i = 1; i <= 5; i++) {
        const dateStr = daily.time[i];
        const dateObj = new Date(dateStr + 'T00:00:00');
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        const code = daily.weather_code[i];
        const info = weatherCodes[code] || { icon: 'sun', color: '#fde047' };
        const maxTemp = Math.round(daily.temperature_2m_max[i]);
        const minTemp = Math.round(daily.temperature_2m_min[i]);

        const item = document.createElement('div');
        item.className = 'forecast-item';
        item.innerHTML = `
          <div class="forecast-day">${dayName}</div>
          <i data-lucide="${info.icon}" class="forecast-icon" style="color: ${info.color}"></i>
          <div class="forecast-temp">${maxTemp}° <span style="color: var(--text-muted); font-size: 0.85rem;">${minTemp}°</span></div>
        `;
        forecastList.appendChild(item);
      }
      window.lucide?.createIcons();
    }

    // Canvas Weather Particle Effect Animations
    function initWeatherParticles(type) {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      particles = [];

      const count = type === 'rain' ? 120 : type === 'snow' ? 80 : type === 'thunder' ? 140 : 25;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 8 + 4,
          radius: Math.random() * 3 + 1,
          opacity: Math.random() * 0.5 + 0.2
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          ctx.beginPath();
          if (type === 'rain' || type === 'thunder') {
            ctx.strokeStyle = `rgba(186, 230, 253, ${p.opacity})`;
            ctx.lineWidth = 1.5;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 2, p.y + p.length);
            ctx.stroke();

            p.y += p.speed * 1.5;
            p.x -= 0.5;
          } else if (type === 'snow') {
            ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.y += p.speed * 0.3;
            p.x += Math.sin(p.y * 0.02) * 0.5;
          } else {
            // Ambient Floating Dust / Glow for Clear & Clouds
            ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * 0.3})`;
            ctx.arc(p.x, p.y, p.radius * 1.5, 0, Math.PI * 2);
            ctx.fill();

            p.y -= p.speed * 0.1;
          }

          // Reset positioning
          if (p.y > canvas.height) p.y = -20;
          if (p.y < -20) p.y = canvas.height;
          if (p.x > canvas.width) p.x = 0;
          if (p.x < 0) p.x = canvas.width;
        });

        animationFrameId = requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
